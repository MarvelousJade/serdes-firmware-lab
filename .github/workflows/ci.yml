name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure sanitizers
        if: runner.os == 'Linux'
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSERDES_ENABLE_SANITIZERS=ON
      - name: Build sanitizers
        if: runner.os == 'Linux'
        run: cmake --build build-sanitize
      - name: Test sanitizers
        if: runner.os == 'Linux'
        run: ctest --test-dir build-sanitize --output-on-failure
